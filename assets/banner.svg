<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)" rx="16"/>
  <text x="60" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">HermesZen <tspan fill="#22d3ee">ADK</tspan></text>
  <text x="60" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#94a3b8">A self-running AI agent team that builds your GitHub portfolio — daily.</text>
  <rect x="60" y="175" width="420" height="8" rx="4" fill="url(#accent)"/>
  <g transform="translate(900, 60)">
    <rect width="200" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="100" y="40" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#22d3ee">🤖 8 AGENTS</text>
    <text x="100" y="65" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#94a3b8">Scout · Planner · Coder</text>
    <text x="100" y="85" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#94a3b8">Reviewer · Security</text>
    <text x="100" y="105" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#94a3b8">README · Git · Telegram</text>
  </g>
</svg>
